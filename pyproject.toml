[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clar-curator"
version = "0.1.0"
description = "Auto-generate Workday Studio .clar files from design documents"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "lxml>=5.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
clar-curator = "clar_curator.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
